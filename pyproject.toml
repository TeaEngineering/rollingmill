[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "rollingmill"
dynamic = ["version"]
description = "Open-source USB control stack for Roland DG MDX-series desktop mills"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Chris Shucksmith", email = "chris@shucksmith.co.uk" },
]
keywords = ["roland", "mdx-40a", "mdx-40", "cnc", "mill", "rml-1", "g-code", "usb", "vpanel"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Hardware",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "pyusb>=1.2",
    "pyhershey>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
rollingmill = "rollingmill.tui:main"

[project.urls]
Homepage      = "https://github.com/TeaEngineering/rollingmill"
Repository    = "https://github.com/TeaEngineering/rollingmill"
Documentation = "https://github.com/TeaEngineering/rollingmill/tree/main/docs"
Issues        = "https://github.com/TeaEngineering/rollingmill/issues"

# ── Build / packaging ─────────────────────────────────────────────────────────

[tool.hatch.version]
path = "rollingmill/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["rollingmill"]

[tool.hatch.build.targets.sdist]
include = [
    "/rollingmill",
    "/docs",
    "/sample-nc",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/__pycache__",
    "**/.DS_Store",
    "**/.mypy_cache",
    "**/.ruff_cache",
]

# ── Lint / type / test ────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py310"
line-length    = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]  # long lines in protocol tables

[tool.mypy]
python_version    = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true     # pyusb has no stubs
files = ["rollingmill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts   = "-ra --strict-markers"
