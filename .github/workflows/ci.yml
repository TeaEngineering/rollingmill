name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # erbsland-maze depends on pycairo, which has no Linux wheel and builds
      # against the system cairo headers.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      # erbsland-maze (the 'maze' extra) depends on pycairo, which has no Linux
      # wheel and builds against the system cairo headers.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install ".[dev,maze]"
          python -m pip list

      - name: Run tests
        run: python -m pytest -q
